name: POTIFY TukTuk observer

on:
  pull_request:
    paths:
      - 'tuktuk-worker/**'
      - '.github/workflows/potify-tuktuk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tuktuk-worker
    steps:
      - uses: actions/checkout@v4
      - name: Test decoding and economics
        run: python3 -m unittest discover -s tests -v
      - name: Collect a fresh mainnet sample
        if: github.event_name == 'workflow_dispatch'
        run: python3 -m potify_tuktuk scan --hours 24 --limit 32 --out sample.json
      - name: Save the sample
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: potify-tuktuk-mainnet
          path: tuktuk-worker/sample.json
          if-no-files-found: warn
